<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar - PriorityIQ</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<nav class="topnav">
    <h1>PriorityIQ</h1>

    <div class="navlinks" id="navlinks">
        <a href="/">Dashboard</a>
        <a href="/add">Add Task</a>
        <a href="/calendar">Calendar</a>
        <a href="/analytics">Analytics</a>
        <button onclick="toggleDarkMode()" class="btn-small" style="margin-left:10px;">🌙 Dark</button>
        <span id="userBlock" style="margin-left:12px"></span>
    </div>

    <script>
      async function refreshUserBlock(){
        try{
          const res = await fetch("/api/auth/status");
          const j = await res.json();
          const b = document.getElementById("userBlock");
          if (j.logged_in){
            b.innerHTML = `Logged in: ${j.email} 
              <button onclick="logout()" class="btn" 
                style="padding:4px 8px;margin-left:8px">Logout</button>`;
          } else {
            b.innerHTML = `<a href="/login">Login</a>`;
          }
        }catch(e){}
      }

      async function logout(){
        await fetch("/api/auth/logout", {method:"POST"});
        window.location.href = "/login";
      }

      function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
        localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
      }

      document.addEventListener("DOMContentLoaded", () => {
        refreshUserBlock();
        if (localStorage.getItem("darkMode") === "true") {
          document.body.classList.add("dark-mode");
        }
      });
    </script>
</nav>

<main class="container">
    
    <h2>📅 Task Calendar</h2>

    <div class="calendar-controls">
        <button onclick="previousMonth()" class="btn-small">◀ Previous</button>
        <h3 id="currentMonth"></h3>
        <button onclick="nextMonth()" class="btn-small">Next ▶</button>
    </div>

    <div id="calendar" class="calendar-grid"></div>

    <div class="calendar-legend">
        <span><span class="legend-dot" style="background:#ff3b3b;"></span> High Priority</span>
        <span><span class="legend-dot" style="background:#ff9d2e;"></span> Medium Priority</span>
        <span><span class="legend-dot" style="background:#2ecc71;"></span> Low Priority</span>
        <span><span class="legend-dot" style="background:#95a5a6;"></span> No Priority</span>
    </div>

    <!-- Task Details Modal -->
    <div id="taskModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 id="modalDate"></h3>
            <div id="modalTasks"></div>
            <button class="btn" onclick="closeTaskModal()">Close</button>
        </div>
    </div>

</main>

<script>
let currentDate = new Date();
let allTasks = [];

async function loadTasks() {
    try {
        const res = await fetch("/api/tasks/all");
        if (res.ok) {
            allTasks = await res.json();
            console.log("Total tasks loaded:", allTasks.length);
            console.log("All tasks:", allTasks);
            
            // Log tasks with deadlines
            const tasksWithDeadlines = allTasks.filter(t => t.deadline);
            console.log("Tasks with deadlines:", tasksWithDeadlines.length);
            tasksWithDeadlines.forEach(t => {
                console.log(`Task: ${t.title}, Deadline: ${t.deadline}, Priority: ${t.priority_level}`);
            });
            
            renderCalendar();
        } else {
            console.error("Failed to load tasks:", res.status);
        }
    } catch(e) {
        console.error("Error loading tasks:", e);
    }
}

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    
    // Update month display
    const monthNames = ["January", "February", "March", "April", "May", "June",
                        "July", "August", "September", "October", "November", "December"];
    document.getElementById("currentMonth").innerText = `${monthNames[month]} ${year}`;
    
    // Get first day of month and number of days
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    // Create calendar grid
    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";
    
    // Add day headers
    const dayHeaders = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    dayHeaders.forEach(day => {
        const header = document.createElement("div");
        header.className = "calendar-day-header";
        header.innerText = day;
        calendar.appendChild(header);
    });
    
    // Add empty cells for days before month starts
    for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "calendar-day empty";
        calendar.appendChild(emptyCell);
    }
    
    // Add days of month
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayTasks = allTasks.filter(t => {
            if (!t.deadline) return false;
            
            // Parse the deadline (handle multiple formats)
            let taskDate;
            if (typeof t.deadline === 'string') {
                // Try parsing as Date object
                const parsed = new Date(t.deadline);
                taskDate = `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, '0')}-${String(parsed.getDate()).padStart(2, '0')}`;
            } else {
                taskDate = t.deadline;
            }
            
            return taskDate === dateStr;
        });
        
        // Debug log
        if (dayTasks.length > 0) {
            console.log(`✓ Date ${dateStr} has ${dayTasks.length} tasks`);
            dayTasks.forEach(task => {
                console.log(`  - ${task.title} (Priority: ${task.priority_level})`);
            });
        }
        
        const dayCell = document.createElement("div");
        dayCell.className = "calendar-day";
        
        // Check if today
        const today = new Date();
        if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
            dayCell.classList.add("today");
        }
        
        dayCell.innerHTML = `<div class="day-number">${day}</div>`;
        
        // Add task indicators
        if (dayTasks.length > 0) {
            console.log(`Creating ${dayTasks.length} dots for ${dateStr}`);
            
            const taskIndicators = document.createElement("div");
            taskIndicators.className = "task-indicators";
            taskIndicators.style.display = "flex";
            taskIndicators.style.flexWrap = "wrap";
            taskIndicators.style.gap = "4px";
            taskIndicators.style.marginTop = "8px";
            
            dayTasks.slice(0, 3).forEach((task, index) => {
                const dot = document.createElement("span");
                dot.className = "task-dot";
                const color = getPriorityColor(task.priority_level);
                dot.style.backgroundColor = color;
                dot.style.borderColor = color;
                dot.style.width = "10px";
                dot.style.height = "10px";
                dot.style.borderRadius = "50%";
                dot.style.display = "inline-block";
                dot.style.border = "1px solid rgba(0,0,0,0.1)";
                dot.title = task.title;
                console.log(`  Dot ${index + 1}: ${task.title} - Color: ${color}`);
                taskIndicators.appendChild(dot);
            });
            
            if (dayTasks.length > 3) {
                const more = document.createElement("span");
                more.className = "task-more";
                more.innerText = `+${dayTasks.length - 3}`;
                more.style.fontSize = "10px";
                more.style.color = "#666";
                more.style.fontWeight = "bold";
                more.style.marginLeft = "3px";
                taskIndicators.appendChild(more);
            }
            
            dayCell.appendChild(taskIndicators);
            dayCell.onclick = () => showTasksForDate(dateStr, dayTasks);
            dayCell.style.cursor = "pointer";
            dayCell.classList.add("has-tasks");
            
            console.log(`Dots added to ${dateStr}`);
        }
        
        calendar.appendChild(dayCell);
    }
}

function getPriorityColor(priority) {
    if (!priority) return "#95a5a6"; // Gray for no priority
    
    switch(priority.toLowerCase()) {
        case "high": return "#ff3b3b";
        case "medium": return "#ff9d2e";
        case "low": return "#2ecc71";
        default: return "#95a5a6";
    }
}

function showTasksForDate(date, tasks) {
    document.getElementById("modalDate").innerText = `Tasks for ${date}`;
    
    const modalTasks = document.getElementById("modalTasks");
    modalTasks.innerHTML = "";
    
    tasks.forEach(task => {
        const taskDiv = document.createElement("div");
        taskDiv.className = "modal-task";
        taskDiv.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong>${task.title}</strong>
                <span class="priority-tag ${task.priority_level?.toLowerCase()}">${task.priority_level || "NA"}</span>
            </div>
            <p style="margin:5px 0; color:#666;">${task.description || ""}</p>
            <small>Urgency: ${task.urgency} | Complexity: ${task.complexity} | Hours: ${task.est_hours}</small>
        `;
        modalTasks.appendChild(taskDiv);
    });
    
    document.getElementById("taskModal").style.display = "flex";
}

function closeTaskModal() {
    document.getElementById("taskModal").style.display = "none";
}

function previousMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
}

function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
}

// Close modal on outside click
window.onclick = function(event) {
    const modal = document.getElementById("taskModal");
    if (event.target == modal) {
        modal.style.display = "none";
    }
}

// Load on page load
document.addEventListener("DOMContentLoaded", loadTasks);
</script>

</body>
</html>
