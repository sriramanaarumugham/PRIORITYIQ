<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console - PriorityIQ</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { margin: 0; background: #f4f6fb; font-family: Arial, sans-serif; color: #1f2937; }
        .topbar { background: #111827; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        .topbar h1 { margin: 0; font-size: 20px; }
        .topbar .actions { display: flex; gap: 10px; }
        .btn { border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-muted { background: #e5e7eb; color: #111827; }
        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); padding: 18px; }
        .card h3 { margin: 0; font-size: 14px; color: #6b7280; }
        .card p { margin: 8px 0 0 0; font-size: 24px; font-weight: 700; }
        .tabs { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
        .tab-btn { border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; background: #dbeafe; color: #1e40af; }
        .tab-btn.active { background: #1d4ed8; color: #fff; }
        .panel { background: #fff; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); padding: 16px; display: none; }
        .panel.active { display: block; }
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        input, select, textarea { border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 10px; }
        .table-wrap { overflow: auto; border: 1px solid #e5e7eb; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 10px; border-bottom: 1px solid #f0f2f5; text-align: left; font-size: 14px; vertical-align: top; }
        th { background: #f9fafb; position: sticky; top: 0; }
        .users-table { table-layout: fixed; min-width: 980px; }
        .users-table th, .users-table td { vertical-align: middle; }
        .users-table th:nth-child(1), .users-table td:nth-child(1) { width: 60px; }
        .users-table th:nth-child(2), .users-table td:nth-child(2) { width: 220px; }
        .users-table th:nth-child(3), .users-table td:nth-child(3) { width: 240px; }
        .users-table th:nth-child(4), .users-table td:nth-child(4) { width: 140px; }
        .users-table th:nth-child(5), .users-table td:nth-child(5) { width: 110px; }
        .users-table th:nth-child(6), .users-table td:nth-child(6),
        .users-table th:nth-child(7), .users-table td:nth-child(7) { width: 90px; text-align: center; }
        .users-table th:nth-child(8), .users-table td:nth-child(8) { width: 190px; }
        .actions-cell { white-space: nowrap; }
        .actions-cell .btn { min-width: 74px; }
        .badge { padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-admin { background: #fee2e2; color: #991b1b; }
        .badge-user { background: #dcfce7; color: #166534; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; width: min(560px, 94%); border-radius: 12px; padding: 18px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full { grid-column: 1 / -1; }
        @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>PriorityIQ Admin Console</h1>
        <div class="actions">
            <button class="btn btn-muted" onclick="window.location.href='/'">User Dashboard</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="container">
        <section class="stats">
            <div class="card"><h3>Total Users</h3><p id="totalUsers">0</p></div>
            <div class="card"><h3>Total Tasks</h3><p id="totalTasks">0</p></div>
            <div class="card"><h3>Completed Tasks</h3><p id="completedTasks">0</p></div>
            <div class="card"><h3>Admin Users</h3><p id="adminUsers">0</p></div>
        </section>

        <section class="tabs">
            <button class="tab-btn active" onclick="switchTab('usersPanel', this)">Users</button>
            <button class="tab-btn" onclick="switchTab('tasksPanel', this)">Tasks</button>
            <button class="tab-btn" onclick="switchTab('rolesPanel', this)">Roles</button>
            <button class="tab-btn" onclick="switchTab('notificationsPanel', this)">Notifications</button>
            <button class="tab-btn" onclick="switchTab('auditPanel', this)">Audit</button>
            <button class="tab-btn" onclick="switchTab('backupPanel', this)">Backup</button>
        </section>

        <section id="usersPanel" class="panel active">
            <div class="toolbar">
                <input id="userSearch" type="text" placeholder="Search by name or email" oninput="renderUsers()">
                <button class="btn btn-primary" onclick="loadUsers()">Refresh Users</button>
            </div>
            <div class="table-wrap">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Admin</th>
                            <th>Tasks</th>
                            <th>Completed</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
        </section>

        <section id="tasksPanel" class="panel">
            <div class="toolbar">
                <input id="taskSearch" type="text" placeholder="Search by task title or user email" oninput="renderTasks()">
                <select id="taskStatusFilter" onchange="renderTasks()">
                    <option value="">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
                <select id="bulkAction">
                    <option value="">Bulk Action</option>
                    <option value="status:Completed">Set Status: Completed</option>
                    <option value="status:In Progress">Set Status: In Progress</option>
                    <option value="status:Pending">Set Status: Pending</option>
                    <option value="priority:High">Set Priority: High</option>
                    <option value="priority:Medium">Set Priority: Medium</option>
                    <option value="priority:Low">Set Priority: Low</option>
                    <option value="delete:1">Delete Selected</option>
                </select>
                <button class="btn btn-danger" onclick="applyBulkAction()">Apply Bulk Action</button>
                <button class="btn btn-primary" onclick="loadTasks()">Refresh Tasks</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAllTasks" onchange="toggleAllTasks(this.checked)"></th>
                            <th>ID</th>
                            <th>User</th>
                            <th>Title</th>
                            <th>Deadline</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Hours</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tasksBody"></tbody>
                </table>
            </div>
        </section>

        <section id="rolesPanel" class="panel">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="loadAdminUsers()">Refresh Admin Roles</button>
            </div>
            <div style="margin-bottom:10px;">
                <strong>Your Role:</strong> <span id="myAdminRole">-</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsersBody"></tbody>
                </table>
            </div>
        </section>

        <section id="notificationsPanel" class="panel">
            <div class="grid">
                <div class="full">
                    <label>Title</label>
                    <input id="broadcastTitle" type="text" placeholder="Announcement title">
                </div>
                <div class="full">
                    <label>Message</label>
                    <textarea id="broadcastMessage" rows="3" placeholder="Write notification message"></textarea>
                </div>
                <div>
                    <label>Type</label>
                    <select id="broadcastType">
                        <option value="admin">Admin</option>
                        <option value="info">Info</option>
                        <option value="warning">Warning</option>
                    </select>
                </div>
                <div>
                    <label>Target</label>
                    <select id="broadcastTarget">
                        <option value="all">All Users</option>
                    </select>
                </div>
                <div class="full" style="display:flex; justify-content:flex-end;">
                    <button class="btn btn-primary" onclick="broadcastNotification()">Send Notification</button>
                </div>
            </div>
        </section>

        <section id="auditPanel" class="panel">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="loadAuditLogs()">Refresh Audit Logs</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>When</th>
                            <th>Admin</th>
                            <th>Role</th>
                            <th>Action</th>
                            <th>Entity</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="auditBody"></tbody>
                </table>
            </div>
        </section>

        <section id="backupPanel" class="panel">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="exportBackup()">Export Backup</button>
                <select id="restoreMode">
                    <option value="append">Restore Mode: Append</option>
                    <option value="replace">Restore Mode: Replace</option>
                </select>
                <button class="btn btn-danger" onclick="restoreBackup()">Restore Backup JSON</button>
            </div>
            <label>Paste Backup JSON</label>
            <textarea id="backupJson" rows="10" style="width:100%;"></textarea>
        </section>
    </main>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3>Edit User</h3>
            <div class="grid">
                <input type="hidden" id="editUserId">
                <div>
                    <label>Name</label>
                    <input id="editUserName" type="text">
                </div>
                <div>
                    <label>Email</label>
                    <input id="editUserEmail" type="email">
                </div>
                <div>
                    <label>Phone</label>
                    <input id="editUserPhone" type="text">
                </div>
                <div>
                    <label>Role</label>
                    <input id="editUserRole" type="text">
                </div>
                <div>
                    <label>Admin Access</label>
                    <select id="editUserAdmin">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>
                <div class="full" style="display:flex; gap:10px; justify-content:flex-end; margin-top:6px;">
                    <button class="btn btn-muted" onclick="closeModal('userModal')">Cancel</button>
                    <button class="btn btn-primary" onclick="saveUser()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h3>Edit Task</h3>
            <div class="grid">
                <input type="hidden" id="editTaskId">
                <div class="full">
                    <label>Title</label>
                    <input id="editTaskTitle" type="text">
                </div>
                <div class="full">
                    <label>Description</label>
                    <textarea id="editTaskDescription" rows="3"></textarea>
                </div>
                <div>
                    <label>Deadline</label>
                    <input id="editTaskDeadline" type="date">
                </div>
                <div>
                    <label>Status</label>
                    <select id="editTaskStatus">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div>
                    <label>Priority</label>
                    <select id="editTaskPriority">
                        <option value="">None</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div>
                    <label>Est. Hours</label>
                    <input id="editTaskHours" type="number" step="0.5">
                </div>
                <div class="full" style="display:flex; gap:10px; justify-content:flex-end; margin-top:6px;">
                    <button class="btn btn-muted" onclick="closeModal('taskModal')">Cancel</button>
                    <button class="btn btn-primary" onclick="saveTask()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let users = [];
        let tasks = [];
        let adminUsers = [];
        let selectedTaskIds = new Set();
        let adminContext = null;

        function switchTab(panelId, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            btn.classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        async function guardedFetch(url, options = {}) {
            const res = await fetch(url, options);
            if (res.status === 401 || res.status === 403) {
                alert('Admin session required.');
                window.location.href = '/admin-login';
                throw new Error('Unauthorized');
            }
            return res;
        }

        async function loadOverview() {
            const res = await guardedFetch('/api/admin/console/overview');
            const data = await res.json();
            if (!data.success) return;
            document.getElementById('totalUsers').textContent = data.overview.total_users;
            document.getElementById('totalTasks').textContent = data.overview.total_tasks;
            document.getElementById('completedTasks').textContent = data.overview.completed_tasks;
            document.getElementById('adminUsers').textContent = data.overview.admin_users;
        }

        async function loadUsers() {
            const res = await guardedFetch('/api/admin/console/users');
            const data = await res.json();
            if (!res.ok || !data.success) {
                throw new Error(data.message || 'Failed to load users');
            }
            users = data.users || [];
            renderUsers();
        }

        function renderUsers() {
            const q = (document.getElementById('userSearch').value || '').toLowerCase();
            const list = users.filter(u =>
                (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q)
            );

            const body = document.getElementById('usersBody');
            body.innerHTML = list.map(u => `
                <tr>
                    <td>${u.user_id}</td>
                    <td>${u.name || ''}</td>
                    <td>${u.email || ''}</td>
                    <td>${u.role || '-'}</td>
                    <td>${u.is_admin ? '<span class="badge badge-admin">Admin</span>' : '<span class="badge badge-user">User</span>'}</td>
                    <td>${u.task_count}</td>
                    <td>${u.completed_count}</td>
                    <td class="actions-cell">
                        <button class="btn btn-muted" onclick="openUserModal(${u.user_id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteUser(${u.user_id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openUserModal(userId) {
            const u = users.find(x => x.user_id === userId);
            if (!u) return;
            document.getElementById('editUserId').value = u.user_id;
            document.getElementById('editUserName').value = u.name || '';
            document.getElementById('editUserEmail').value = u.email || '';
            document.getElementById('editUserPhone').value = u.phone || '';
            document.getElementById('editUserRole').value = u.role || '';
            document.getElementById('editUserAdmin').value = u.is_admin ? 'true' : 'false';
            document.getElementById('userModal').classList.add('active');
        }

        async function saveUser() {
            const id = Number(document.getElementById('editUserId').value);
            const payload = {
                name: document.getElementById('editUserName').value.trim(),
                email: document.getElementById('editUserEmail').value.trim(),
                phone: document.getElementById('editUserPhone').value.trim(),
                role: document.getElementById('editUserRole').value.trim(),
                is_admin: document.getElementById('editUserAdmin').value === 'true'
            };

            const res = await guardedFetch(`/api/admin/console/users/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!res.ok || !data.success) {
                alert(data.message || 'Failed to update user');
                return;
            }
            closeModal('userModal');
            await Promise.all([loadUsers(), loadOverview()]);
        }

        async function deleteUser(userId) {
            if (!confirm('Delete this user and all related task data?')) return;
            const res = await guardedFetch(`/api/admin/console/users/${userId}`, { method: 'DELETE' });
            const data = await res.json();
            if (!res.ok || !data.success) {
                alert(data.message || 'Failed to delete user');
                return;
            }
            await Promise.all([loadUsers(), loadTasks(), loadOverview()]);
        }

        async function loadTasks() {
            const res = await guardedFetch('/api/admin/console/tasks?limit=500');
            const data = await res.json();
            tasks = data.tasks || [];
            selectedTaskIds = new Set();
            const selectAll = document.getElementById('selectAllTasks');
            if (selectAll) selectAll.checked = false;
            renderTasks();
        }

        function renderTasks() {
            const q = (document.getElementById('taskSearch').value || '').toLowerCase();
            const status = document.getElementById('taskStatusFilter').value;
            const list = tasks.filter(t => {
                const textOk =
                    (t.title || '').toLowerCase().includes(q) ||
                    (t.user_email || '').toLowerCase().includes(q);
                const statusOk = !status || t.status === status;
                return textOk && statusOk;
            });

            const body = document.getElementById('tasksBody');
            body.innerHTML = list.map(t => `
                <tr>
                    <td><input type="checkbox" ${selectedTaskIds.has(t.task_id) ? 'checked' : ''} onchange="toggleTaskSelection(${t.task_id}, this.checked)"></td>
                    <td>${t.task_id}</td>
                    <td>${t.user_name || ''}<br><small>${t.user_email || ''}</small></td>
                    <td>${t.title || ''}</td>
                    <td>${t.deadline || '-'}</td>
                    <td>${t.priority_level || '-'}</td>
                    <td>${t.status || '-'}</td>
                    <td>${t.est_hours || '-'}</td>
                    <td>
                        <button class="btn btn-muted" onclick="openTaskModal(${t.task_id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteTask(${t.task_id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function toggleTaskSelection(taskId, checked) {
            if (checked) selectedTaskIds.add(taskId);
            else selectedTaskIds.delete(taskId);
        }

        function toggleAllTasks(checked) {
            const rows = tasks.map(t => t.task_id);
            if (checked) rows.forEach(id => selectedTaskIds.add(id));
            else selectedTaskIds.clear();
            renderTasks();
        }

        async function applyBulkAction() {
            const actionRaw = document.getElementById('bulkAction').value;
            if (!actionRaw) {
                alert('Choose a bulk action first.');
                return;
            }
            const taskIds = Array.from(selectedTaskIds);
            if (taskIds.length === 0) {
                alert('Select at least one task.');
                return;
            }
            const [action, value] = actionRaw.split(':');
            if (action === 'delete' && !confirm(`Delete ${taskIds.length} selected task(s)?`)) return;

            const res = await guardedFetch('/api/admin/console/tasks/bulk', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ task_ids: taskIds, action, value })
            });
            const data = await res.json();
            if (!res.ok || !data.success) {
                alert(data.message || 'Bulk action failed');
                return;
            }
            selectedTaskIds.clear();
            document.getElementById('bulkAction').value = '';
            await Promise.all([loadTasks(), loadUsers(), loadOverview(), loadAuditLogs()]);
        }

        function openTaskModal(taskId) {
            const t = tasks.find(x => x.task_id === taskId);
            if (!t) return;
            document.getElementById('editTaskId').value = t.task_id;
            document.getElementById('editTaskTitle').value = t.title || '';
            document.getElementById('editTaskDescription').value = t.description || '';
            document.getElementById('editTaskDeadline').value = t.deadline || '';
            document.getElementById('editTaskStatus').value = t.status || 'Pending';
            document.getElementById('editTaskPriority').value = t.priority_level || '';
            document.getElementById('editTaskHours').value = t.est_hours || '';
            document.getElementById('taskModal').classList.add('active');
        }

        async function saveTask() {
            const id = Number(document.getElementById('editTaskId').value);
            const payload = {
                title: document.getElementById('editTaskTitle').value.trim(),
                description: document.getElementById('editTaskDescription').value.trim(),
                deadline: document.getElementById('editTaskDeadline').value || null,
                status: document.getElementById('editTaskStatus').value,
                priority_level: document.getElementById('editTaskPriority').value || null,
                est_hours: Number(document.getElementById('editTaskHours').value || 0)
            };

            const res = await guardedFetch(`/api/admin/console/tasks/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!res.ok || !data.success) {
                alert(data.message || 'Failed to update task');
                return;
            }
            closeModal('taskModal');
            await Promise.all([loadTasks(), loadOverview()]);
        }

        async function deleteTask(taskId) {
            if (!confirm('Delete this task?')) return;
            const res = await guardedFetch(`/api/admin/console/tasks/${taskId}`, { method: 'DELETE' });
            const data = await res.json();
            if (!res.ok || !data.success) {
                alert(data.message || 'Failed to delete task');
                return;
            }
            await Promise.all([loadTasks(), loadUsers(), loadOverview()]);
        }

        async function loadAdminRoleContext() {
            const res = await guardedFetch('/api/admin/console/admin-role');
            const data = await res.json();
            if (!res.ok || !data.success) return;
            adminContext = data;
            document.getElementById('myAdminRole').textContent = data.role || '-';
        }

        async function loadAdminUsers() {
            const res = await guardedFetch('/api/admin/console/admin-users');
            const data = await res.json();
            if (!res.ok || !data.success) {
                document.getElementById('adminUsersBody').innerHTML = `<tr><td colspan="4">${data.message || 'Unable to load admin users'}</td></tr>`;
                return;
            }
            adminUsers = data.admins || [];
            const body = document.getElementById('adminUsersBody');
            body.innerHTML = adminUsers.map(a => `
                <tr>
                    <td>${a.name || '-'}</td>
                    <td>${a.email || '-'}</td>
                    <td>
                        <select id="role_${a.user_id}">
                            ${['super_admin', 'manager', 'support', 'viewer'].map(r => `<option value="${r}" ${a.role === r ? 'selected' : ''}>${r}</option>`).join('')}
                        </select>
                    </td>
                    <td><button class="btn btn-primary" onclick="updateAdminRole(${a.user_id})">Update Role</button></td>
                </tr>
            `).join('');
        }

        async function updateAdminRole(userId) {
            const role = document.getElementById(`role_${userId}`).value;
            const res = await guardedFetch(`/api/admin/console/admin-users/${userId}/role`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ role })
            });
            const data = await res.json();
            if (!res.ok || !data.success) {
                alert(data.message || 'Failed to update role');
                return;
            }
            await Promise.all([loadAdminUsers(), loadAuditLogs()]);
        }

        async function broadcastNotification() {
            const title = document.getElementById('broadcastTitle').value.trim();
            const message = document.getElementById('broadcastMessage').value.trim();
            const type = document.getElementById('broadcastType').value;
            const target = document.getElementById('broadcastTarget').value;
            if (!title || !message) {
                alert('Title and message are required.');
                return;
            }
            const res = await guardedFetch('/api/admin/console/notifications/broadcast', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title, message, type, target })
            });
            const data = await res.json();
            if (!res.ok || !data.success) {
                alert(data.message || 'Broadcast failed');
                return;
            }
            alert(`Notification sent to ${data.sent} users.`);
            document.getElementById('broadcastTitle').value = '';
            document.getElementById('broadcastMessage').value = '';
            await loadAuditLogs();
        }

        async function loadAuditLogs() {
            const res = await guardedFetch('/api/admin/console/audit?limit=200');
            const data = await res.json();
            const body = document.getElementById('auditBody');
            if (!res.ok || !data.success) {
                body.innerHTML = `<tr><td colspan="6">${data.message || 'Unable to load audit logs'}</td></tr>`;
                return;
            }
            const logs = data.logs || [];
            body.innerHTML = logs.map(l => `
                <tr>
                    <td>${l.created_at || '-'}</td>
                    <td>${l.admin_email || '-'}</td>
                    <td>${l.admin_role || '-'}</td>
                    <td>${l.action || '-'}</td>
                    <td>${l.entity_type || '-'} ${l.entity_id || ''}</td>
                    <td><small>${l.details || '-'}</small></td>
                </tr>
            `).join('');
        }

        async function exportBackup() {
            window.location.href = '/api/admin/console/backup/export';
        }

        async function restoreBackup() {
            const snapshotText = document.getElementById('backupJson').value.trim();
            const mode = document.getElementById('restoreMode').value;
            if (!snapshotText) {
                alert('Paste backup JSON first.');
                return;
            }
            if (!confirm(`Restore backup in ${mode} mode?`)) return;

            let payload;
            try {
                payload = JSON.parse(snapshotText);
            } catch {
                alert('Invalid JSON');
                return;
            }
            const res = await guardedFetch('/api/admin/console/backup/restore', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ snapshot: payload, mode })
            });
            const data = await res.json();
            if (!res.ok || !data.success) {
                alert(data.message || 'Restore failed');
                return;
            }
            alert(`Restore completed. Affected rows: ${data.affected}`);
            await Promise.all([loadOverview(), loadUsers(), loadTasks(), loadAuditLogs(), loadAdminUsers()]);
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/admin-login';
        }

        async function boot() {
            try {
                const check = await guardedFetch('/api/admin/check');
                const checkData = await check.json();
                if (!checkData.is_admin) {
                    window.location.href = '/';
                    return;
                }
                await Promise.all([loadOverview(), loadUsers(), loadTasks(), loadAdminRoleContext(), loadAuditLogs(), loadAdminUsers()]);
            } catch (err) {
                console.error(err);
                alert(err.message || 'Failed to load admin console data.');
            }
        }

        boot();
    </script>
</body>
</html>
