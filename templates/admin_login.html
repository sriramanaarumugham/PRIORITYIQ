<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PriorityIQ</title>
    <link rel="icon" type="image/png" href="/static/icon-192.png">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .admin-badge {
            background: linear-gradient(135deg, #1a73e8 0%, #0f9d58 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<nav class="topnav">
    <h1>PriorityIQ</h1>
    <div class="navlinks">
        <a href="/login">Student Login</a>
    </div>
</nav>

<main class="container">

    <div class="auth-container">
        <div class="admin-badge">Admin Access</div>
        <h2>College Admin Login</h2>
        
        <div class="card form-card">

            <label>Admin Email:</label>
            <input type="email" id="email" placeholder="Enter admin email" onkeypress="if(event.key==='Enter') requestOTP()">

            <button class="btn" onclick="requestOTP()">Request OTP</button>

            <p id="msg" style="margin-top: 15px; color: #e74c3c;"></p>

            <p style="text-align:center; margin-top:20px;">
                New admin? <a href="/admin-register">Register admin account</a><br>
                <a href="/login">&larr; Back to Student Login</a>
            </p>

        </div>
    </div>

</main>

<!-- OTP Popup Modal -->
<div id="otpModal" class="modal">
    <div class="modal-content">
        <h3>Your Admin OTP</h3>
        <div class="otp-display" id="otpDisplay">------</div>
        <p style="font-size: 14px; color: #666; margin-top: 10px;">
            Please use this OTP to verify your admin login
        </p>
        <button class="btn" onclick="closeModal()">Got it!</button>
    </div>
</div>

<script>
async function requestOTP() {
    const email = document.getElementById("email").value.trim();
    const msgDiv = document.getElementById("msg");

    if (!email) {
        msgDiv.innerText = "Please enter your admin email";
        msgDiv.style.color = "#e74c3c";
        return;
    }

    try {
        const res = await fetch("/api/auth/request_otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, login_type: "admin" })
        });

        let data = null;
        try {
            data = await res.json();
        } catch (parseError) {
            const raw = await res.text();
            msgDiv.innerText = raw ? raw.slice(0, 200) : "Server returned invalid response";
            msgDiv.style.color = "#e74c3c";
            return;
        }

        if (!res.ok || !data.success) {
            msgDiv.innerText = data.message || `Request failed (${res.status})`;
            msgDiv.style.color = "#e74c3c";
            return;
        }

        // Show OTP in popup
        document.getElementById("otpDisplay").innerText = data.otp;
        document.getElementById("otpModal").style.display = "flex";
        
        // Store email for later use
        sessionStorage.setItem('loginEmail', email);
        
        msgDiv.innerText = "Admin OTP sent! Check the popup.";
        msgDiv.style.color = "#2ecc71";

    } catch (e) {
        msgDiv.innerText = "Failed to request OTP. Please try again.";
        msgDiv.style.color = "#e74c3c";
    }
}

function closeModal() {
    document.getElementById("otpModal").style.display = "none";
    window.location.href = "/verify-otp";
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById("otpModal");
    if (event.target == modal) {
        modal.style.display = "none";
    }
}
</script>

</body>
</html>
