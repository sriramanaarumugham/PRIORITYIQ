<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Registration - PriorityIQ</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .admin-badge {
            background: linear-gradient(135deg, #1a73e8 0%, #0f9d58 100%);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<nav class="topnav">
    <h1>PriorityIQ</h1>
    <div class="navlinks">
        <a href="/admin-login">Admin Login</a>
        <a href="/login">Student Login</a>
    </div>
</nav>

<main class="container">
    <div class="auth-container">
        <div class="admin-badge">Admin Access</div>
        <h2>Register Admin Account</h2>

        <div class="card form-card" onkeypress="if(event.key==='Enter') registerAdmin()">
            <label>Full Name *</label>
            <input type="text" id="name" placeholder="Enter full name" required>

            <label>Admin Email *</label>
            <input type="email" id="email" placeholder="Enter admin email" required>

            <label>Phone Number *</label>
            <input type="tel" id="phone" placeholder="Enter 10-digit phone number" required>

            <label>Department</label>
            <input type="text" id="department" placeholder="e.g. Computer Science">

            <label>Admin Registration Key *</label>
            <input type="password" id="admin_key" placeholder="Enter the required admin key" required>

            <button class="btn" onclick="registerAdmin()">Create Admin Account</button>

            <div id="message" style="margin-top:15px; color:#e74c3c;"></div>

            <p style="text-align:center; margin-top:20px;">
                Already registered? <a href="/admin-login">Go to Admin Login</a><br>
                <a href="/register">Student registration</a>
            </p>
        </div>
    </div>
</main>

<script>
async function registerAdmin() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const department = document.getElementById("department").value.trim();
    const admin_key = document.getElementById("admin_key").value;
    const msgDiv = document.getElementById("message");

    if (!name || !email || !phone || !admin_key) {
        msgDiv.innerText = "Name, admin email, phone, and admin key are required.";
        msgDiv.style.color = "#e74c3c";
        return;
    }

    try {
        const res = await fetch("/api/auth/register_admin", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ name, email, phone, department, admin_key })
        });

        const data = await res.json();
        if (data.success) {
            msgDiv.innerText = data.message;
            msgDiv.style.color = "#2ecc71";
            setTimeout(() => {
                window.location.href = "/admin-login";
            }, 1200);
        } else {
            msgDiv.innerText = data.message;
            msgDiv.style.color = "#e74c3c";
        }
    } catch (e) {
        msgDiv.innerText = "Admin registration failed. Please try again.";
        msgDiv.style.color = "#e74c3c";
    }
}
</script>

</body>
</html>
